# Publica la carpeta app/ en GitHub Pages cada vez que cambia: https://felipeberney-boop.github.io/ciclo/
name: Publicar la app
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar_app.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
