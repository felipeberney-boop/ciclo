<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F0EB"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">DESDE EL 25 DE AGOSTO</tspan></text><text x="100" y="253" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">QUÉ CAMBIÓ</tspan><tspan x="100" dy="104.0">DESDE LA ENTREGA 1</tspan></text><rect x="100" y="500" width="380" height="3" fill="#000000"/><text x="100" y="541" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="100" dy="0.0">01</tspan></text><text x="100" y="607" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">La hipótesis</tspan></text><text x="100" y="672" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Pasó de «cruzar señales»</tspan><tspan x="100" dy="39.1">a algo que se puede</tspan><tspan x="100" dy="39.1">medir: en qué etapa está</tspan><tspan x="100" dy="39.1">cada atributo, sin que</tspan><tspan x="100" dy="39.1">nadie etiquete las etapas</tspan><tspan x="100" dy="39.1">a mano.</tspan></text><rect x="530" y="500" width="380" height="3" fill="#000000"/><text x="530" y="541" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="530" dy="0.0">02</tspan></text><text x="530" y="607" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="500" fill="#000000" text-anchor="start"><tspan x="530" dy="0.0">La usuaria</tspan></text><text x="530" y="672" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="530" dy="0.0">Dejó de ser «un</tspan><tspan x="530" dy="39.1">diseñador» y es una</tspan><tspan x="530" dy="39.1">forecaster independiente</tspan><tspan x="530" dy="39.1">que asesora a tres</tspan><tspan x="530" dy="39.1">clientes con tres plazos</tspan><tspan x="530" dy="39.1">distintos.</tspan></text><rect x="960" y="500" width="380" height="3" fill="#000000"/><text x="960" y="541" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="960" dy="0.0">03</tspan></text><text x="960" y="607" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="500" fill="#000000" text-anchor="start"><tspan x="960" dy="0.0">Los datos</tspan></text><text x="960" y="672" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="960" dy="0.0">De 3 datasets a 9</tspan><tspan x="960" dy="39.1">fuentes. 1,28 M de looks</tspan><tspan x="960" dy="39.1">de pasarela, 30,6 M de</tspan><tspan x="960" dy="39.1">compras y 22 años de</tspan><tspan x="960" dy="39.1">búsquedas.</tspan></text><rect x="1390" y="500" width="380" height="3" fill="#000000"/><text x="1390" y="541" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="1390" dy="0.0">04</tspan></text><text x="1390" y="607" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1390" dy="0.0">El modelo</tspan></text><text x="1390" y="672" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1390" dy="0.0">Ya corre. K-means sobre</tspan><tspan x="1390" dy="39.1">18 atributos, cuatro</tspan><tspan x="1390" dy="39.1">grupos, validado contra</tspan><tspan x="1390" dy="39.1">capas que el modelo nunca</tspan><tspan x="1390" dy="39.1">vio.</tspan></text></svg>