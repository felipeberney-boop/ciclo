<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F0EB"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">HIPÓTESIS</tspan></text><text x="100" y="291" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">Cruzando lo que la pasarela propone con</tspan><tspan x="100" dy="89.7">lo que la gente busca y lo que el mercado</tspan><tspan x="100" dy="89.7">masivo vende, se puede ubicar cada</tspan><tspan x="100" dy="89.7">atributo de moda en una de cinco etapas</tspan><tspan x="100" dy="89.7">de su ciclo de vida.</tspan></text><text x="100" y="730" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Y se puede hacer sin que nadie etiquete las etapas a mano: el</tspan><tspan x="100" dy="51.3">modelo agrupa, nosotros leemos.</tspan></text><rect x="100" y="880" width="320" height="3" fill="#000000"/><text x="100" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">EMERGENTE</tspan></text><rect x="446" y="880" width="320" height="3" fill="#000000"/><text x="446" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="6"><tspan x="446" dy="0.0">EN ASCENSO</tspan></text><rect x="792" y="880" width="320" height="3" fill="#000000"/><text x="792" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="6"><tspan x="792" dy="0.0">EN PICO</tspan></text><rect x="1138" y="880" width="320" height="3" fill="#000000"/><text x="1138" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="6"><tspan x="1138" dy="0.0">SATURADA</tspan></text><rect x="1484" y="880" width="320" height="3" fill="#000000"/><text x="1484" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="6"><tspan x="1484" dy="0.0">EN RETORNO</tspan></text></svg>