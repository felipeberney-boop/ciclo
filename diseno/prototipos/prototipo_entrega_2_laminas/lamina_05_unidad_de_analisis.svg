<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#000000"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#8A857E" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">UNIDAD DE ANÁLISIS</tspan></text><text x="100" y="402" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="190" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">EL ATRIBUTO</tspan></text><text x="100" y="532" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">No la prenda, no la marca, no «la tendencia». Un</tspan><tspan x="100" dy="56.0">atributo es un color, una estampa, un corte o un</tspan><tspan x="100" dy="56.0">material: lo único que se puede contar en las</tspan><tspan x="100" dy="56.0">cinco capas a la vez.</tspan></text><rect x="100" y="820" width="380" height="3" fill="#8A857E"/><text x="100" y="861" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A857E" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">COLOR</tspan></text><text x="100" y="915" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">rojo cereza</tspan></text><rect x="530" y="820" width="380" height="3" fill="#8A857E"/><text x="530" y="861" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A857E" text-anchor="start" letter-spacing="6"><tspan x="530" dy="0.0">ESTAMPA</tspan></text><text x="530" y="915" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="530" dy="0.0">lunares</tspan></text><rect x="960" y="820" width="380" height="3" fill="#8A857E"/><text x="960" y="861" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A857E" text-anchor="start" letter-spacing="6"><tspan x="960" dy="0.0">CORTE</tspan></text><text x="960" y="915" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="960" dy="0.0">jeans amplios</tspan></text><rect x="1390" y="820" width="380" height="3" fill="#8A857E"/><text x="1390" y="861" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A857E" text-anchor="start" letter-spacing="6"><tspan x="1390" dy="0.0">MATERIAL</tspan></text><text x="1390" y="915" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="1390" dy="0.0">gamuza</tspan></text><text x="1280" y="522" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#8A857E" text-anchor="start"><tspan x="1280" dy="0.0">Por qué importa: si se mira «denim»</tspan><tspan x="1280" dy="40.5">agregado, los jeans amplios y los</tspan><tspan x="1280" dy="40.5">ajustados se cancelan entre sí y no</tspan><tspan x="1280" dy="40.5">se ve nada. Separados, uno está en</tspan><tspan x="1280" dy="40.5">pico y el otro saturado.</tspan></text></svg>