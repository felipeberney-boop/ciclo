<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#000000"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFAFA3" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">CÓMO LEER ESTA PRESENTACIÓN</tspan></text><text x="100" y="307" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">TODO LO QUE TOCA</tspan><tspan x="100" dy="100.8">LA MÁQUINA VA EN</tspan><tspan x="100" dy="100.8">SALMÓN.</tspan></text><text x="100" y="627" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">Lo negro es medido. Lo salmón es calculado o</tspan><tspan x="100" dy="49.3">interpretado por un modelo. Es la misma</tspan><tspan x="100" dy="49.3">regla adentro de la app: lo que sale del</tspan><tspan x="100" dy="49.3">modelo de lenguaje siempre aparece marcado.</tspan></text><rect x="1020" y="250" width="800" height="2" fill="#2A2A2A"/><text x="1020" y="301" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#FFAFA3" text-anchor="start"><tspan x="1020" dy="0.0">IA-1</tspan></text><text x="1130" y="302" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="1130" dy="0.0">Etiquetado de pasarela</tspan></text><text x="1820" y="299" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A857E" text-anchor="end"><tspan x="1820" dy="0.0">batch</tspan></text><rect x="1020" y="368" width="800" height="2" fill="#2A2A2A"/><text x="1020" y="419" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="34" font