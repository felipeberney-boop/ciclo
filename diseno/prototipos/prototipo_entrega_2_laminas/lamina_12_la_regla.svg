<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#000000"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFAFA3" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">LA REGLA QUE ATRAVIESA TODO</tspan></text><text x="100" y="313" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="100" dy="0.0">El modelo de lenguaje</tspan><tspan x="100" dy="112.3">nunca ve una fila</tspan><tspan x="100" dy="112.3">de datos.</tspan></text><rect x="100" y="680" width="400" height="150" fill="#141414" rx="6"/><rect x="100" y="680" width="400" height="5" fill="#FFFFFF"/><text x="122" y="723" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="122" dy="0.0">LOS DATOS</tspan></text><text x="122" y="779" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#9A958E" text-anchor="start"><tspan x="122" dy="0.0">30,6 M de compras</tspan><tspan x="122" dy="32.4">1,28 M de looks</tspan></text><text x="520" y="764" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="middle"><tspan x="520" dy="0.0">→</tspan></text><rect x="540" y="680" width="400" height="150" fill="#141414" rx="6"/><rect x="540" y="680" width="400" height="5" fill="#FFFFFF"/><text x="562" y="723" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0.0">MÉTRICAS CALCULADAS</tspan></text><text x="562" y="779" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#9A958E" text-anchor="start"><tspan x="562" dy="0.0">nivel, momento,</tspan><tspan x="562" dy="32.4">crecimiento, distancia al</tspan><tspan x="562" dy="32.4">pico</tspan></text><text x="960" y="764" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="middle"><tspan x="960" dy="0.0">→</tspan></text><rect x="980" y="680" width="400" height="150" fill="#2A1D1B" rx="6"/><rect x="980" y="680" width="400" height="5" fill="#FFAFA3"/><text x="1002" y="723" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFAFA3" text-anchor="start"><tspan x="1002" dy="0.0">EL MODELO DE LENGUAJE</tspan></text><text x="1002" y="779" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#FFAFA3" text-anchor="start"><tspan x="1002" dy="0.0">lee sólo esos números</tspan><tspan x="1002" dy="32.4">y el tipo de cliente</tspan></text><text x="1400" y="764" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="middle"><tspan x="1400" dy="0.0">→</tspan></text><rect x="1420" y="680" width="400" height="150" fill="#2A1D1B" rx="6"/><rect x="1420" y="680" width="400" height="5" fill="#FFAFA3"/><text x="1442" y="723" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFAFA3" text-anchor="start"><tspan x="1442" dy="0.0">LA PANTALLA</tspan></text><text x="1442" y="779" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#FFAFA3" text-anchor="start"><tspan x="1442" dy="0.0">una acción y una frase,</tspan><tspan x="1442" dy="32.4">marcadas como</tspan><tspan x="1442" dy="32.4">interpretación</tspan></text><text x="100" y="902" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#9A958E" text-anchor="start"><tspan x="100" dy="0.0">Lo que devuelve es opinión, no dato, y en la interfaz siempre</tspan><tspan x="100" dy="39.1">aparece con esa marca. Es la diferencia entre una app que calcula y</tspan><tspan x="100" dy="39.1">una que inventa.</tspan></text></svg>