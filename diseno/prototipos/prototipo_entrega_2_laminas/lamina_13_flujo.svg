ument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#000000" text-anchor="start"><tspan x="488" dy="0.0">B · EL ÍNDICE</tspan></text><text x="488" y="483" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="488" dy="0.0">las siete secciones, en orden</tspan></text><text x="925" y="400" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="400" fill="#5C5955" text-anchor="middle"><tspan x="925" dy="0.0">→</tspan></text><rect x="960" y="300" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="974" y="334" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="974" dy="0.0">RADAR</tspan></text><text x="974" y="360" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="974" dy="0.0">qué se está</tspan><tspan x="974" dy="22.5">moviendo</tspan></text><rect x="1180" y="300" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="1194" y="334" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1194" dy="0.0">EL CICLO</tspan></text><text x="1194" y="360" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1194" dy="0.0">en qué etapa está</tspan><tspan x="1194" dy="22.5">cada una</tspan></text><rect x="1400" y="300" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="1414" y="334" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1414" dy="0.0">RECORRIDOS</tspan></text><text x="1414" y="360" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1414" dy="0.0">de la pasarela a</tspan><tspan x="1414" dy="22.5">la calle</tspan></text><rect x="1620" y="300" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="1634" y="334" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1634" dy="0.0">MARCAS</tspan></text><text x="1634" y="360" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1634" dy="0.0">quién manda</tspan></text><rect x="960" y="412" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="974" y="446" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="974" dy="0.0">RETORNOS</tspan></text><text x="974" y="472" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="974" dy="0.0">lo que vuelve</tspan></text><rect x="1180" y="412" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="1194" y="446" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1194" dy="0.0">CONSULTA</tspan></text><text x="1194" y="472" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1194" dy="0.0">pegá una prenda</tspan></text><rect x="1400" y="412" width="200" height="96" fill="#E6E1DB" rx="4"/><text x="1414" y="446" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1414" dy="0.0">MÉTODO</tspan></text><text x="1414" y="472" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1414" dy="0.0">por qué podés</tspan><tspan x="1414" dy="22.5">creerle</tspan></text><text x="100" y="638" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="100" dy="0.0">LO QUE LA IA RESPONDE EN CADA PUNTO</tspan></text><rect x="100" y="670" width="540" height="6" fill="#FFAFA3"/><text x="100" y="717" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Desde Detalle</tspan></text><text x="100" y="768" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#B8503D" text-anchor="start"><tspan x="100" dy="0.0">IA-5</tspan></text><text x="100" y="813" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">la recomendación según el tipo de</tspan><tspan x="100" dy="36.4">cliente</tspan></text><rect x="680" y="670" width="540" height="6" fill="#FFAFA3"/><text x="680" y="717" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="680" dy="0.0">Desde El ciclo</tspan></text><text x="680" y="768" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#B8503D" text-anchor="start"><tspan x="680" dy="0.0">IA-4</tspan></text><text x="680" y="813" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#000000" text-anchor="start"><tspan x="680" dy="0.0">probar un atributo que no está en la</tspan><tspan x="680" dy="36.4">base</tspan></text><rect x="1260" y="670" width="540" height="6" fill="#FFAFA3"/><text x="1260" y="717" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1260" dy="0.0">Desde Consulta</tspan></text><text x="1260" y="768" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#B8503D" text-anchor="start"><tspan x="1260" dy="0.0">IA-6</tspan></text><text x="1260" y="813" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#000000" text-anchor="start"><tspan x="1260" dy="0.0">subir una foto y recibir la etapa</tspan></text><text x="100" y="921" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">La portada no es decorativa: es la primera decisión de diseño. Obliga a la usuaria a declarar qué quiere descubrir antes</tspan><tspan x="100" dy="37.7">de ver un número, porque la app no tiene una respuesta única — tiene una por atributo.</tspan></text></svg>