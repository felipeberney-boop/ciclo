aleta</tspan><tspan x="540" dy="25.7">medida y su posición en el ciclo. H&amp;M</tspan><tspan x="540" dy="25.7">+ Zara.</tspan></text><rect x="980" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="980" y="340" width="400" height="34" fill="#E6E1DB"/><text x="992" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="992" dy="0.0">DETALLE</tspan></text><rect x="1004" y="398" width="160" height="60" fill="#E6E1DB" rx="3"/><text x="1012" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">paleta medida</tspan></text><rect x="1176" y="398" width="180" height="60" fill="#E6E1DB" rx="3"/><text x="1184" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1184" dy="0.0">etapa</tspan></text><rect x="1004" y="470" width="352" height="80" fill="#E6E1DB" rx="3"/><text x="1012" y="487" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">curva por capa · 2004–2025</tspan></text><rect x="1004" y="562" width="352" height="44" fill="#FFAFA3" rx="3"/><text x="1012" y="579" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">IA-5 · recomendación según cliente</tspan></text><text x="980" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="980" dy="0.0">Detalle del atributo</tspan></text><text x="980" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="980" dy="0.0">Vogue Runway + Google Trends + Reddit.</tspan><tspan x="980" dy="25.7">Abajo, la lectura del modelo.</tspan></text><rect x="1420" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="1420" y="340" width="400" height="34" fill="#E6E1DB"/><text x="1432" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1432" dy="0.0">EL CICLO</tspan></text><rect x="1444" y="398" width="230" height="150" fill="#E6E1DB" rx="3"/><text x="1452" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1452" dy="0.0">scatter de los 4 grupos</tspan></text><rect x="1684" y="398" width="112" height="34" fill="#E6E1DB" rx="3"/><text x="1692" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1692" dy="0.0">k = 4</tspan></text><rect x="1684" y="440" width="112" height="34" fill="#E6E1DB" rx="3"/><text x="1692" y="457" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1692" dy="0.0">silhouette</tspan></text><rect x="1684" y="482" width="112" height="66" fill="#E6E1DB" rx="3"/><text x="1692" y="499" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1692" dy="0.0">validación</tspan></text><rect x="1444" y="560" width="352" height="46" fill="#FFAFA3" rx="3"/><text x="1452" y="577" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1452" dy="0.0">IA-4 · probar una tendencia nueva</tspan></text><text x="1420" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1420" dy="0.0">El ciclo · K-means</tspan></text><text x="1420" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1420" dy="0.0">Las 18 filas del modelo, los</tspan><tspan x="1420" dy="25.7">centroides y la validación con Amazon</tspan><tspan x="1420" dy="25.7">y Shopping.</tspan></text><text x="100" y="821" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Son esquemas, no diseño final: lo que se decide acá es qué información entra en cada pantalla y en qué orden, no cómo se</tspan><tspan x="100" dy="37.7">ve. En salmón, los bloques donde interviene la IA.</tspan></text></svg>