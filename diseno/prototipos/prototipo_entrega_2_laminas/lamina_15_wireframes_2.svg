<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F0EB"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">PROTOTIPO DE BAJA FIDELIDAD · 2 DE 2</tspan></text><text x="100" y="234" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">LAS PANTALLAS</tspan></text><rect x="100" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="100" y="340" width="400" height="34" fill="#E6E1DB"/><text x="112" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="112" dy="0.0">RECORRIDOS</tspan></text><rect x="124" y="398" width="352" height="26" fill="#E6E1DB" rx="3"/><text x="132" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="132" dy="0.0">chips agrupados por prenda</tspan></text><rect x="124" y="436" width="352" height="110" fill="#E6E1DB" rx="3"/><text x="132" y="453" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="132" dy="0.0">pasarela · búsqueda · Reddit</tspan></text><rect x="124" y="558" width="230" height="48" fill="#E6E1DB" rx="3"/><text x="132" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="132" dy="0.0">cuándo tocó techo cada capa</tspan></text><rect x="364" y="558" width="112" height="48" fill="#E6E1DB" rx="3"/><text x="372" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="372" dy="0.0">retraso</tspan></text><text x="100" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">Recorridos</tspan></text><text x="100" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">La cadena completa de un atributo,</tspan><tspan x="100" dy="25.7">cada curva llevada a su propio máximo.</tspan></text><rect x="540" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="540" y="340" width="400" height="34" fill="#E6E1DB"/><text x="552" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="552" dy="0.0">MARCAS</tspan></text><rect x="564" y="398" width="352" height="130" fill="#E6E1DB" rx="3"/><text x="572" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="572" dy="0.0">34 trimestres del Lyst Index</tspan></text><rect x="564" y="540" width="168" height="66" fill="#E6E1DB" rx="3"/><text x="572" y="557" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="572" dy="0.0">historias</tspan></text><rect x="742" y="540" width="174" height="66" fill="#E6E1DB" rx="3"/><text x="750" y="557" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="750" dy="0.0">corte de Q1-26</tspan></text><text x="540" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="540" dy="0.0">Marcas</tspan></text><text x="540" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="540" dy="0.0">Lyst Q1-18 a Q2-26. Declara el corte</tspan><tspan x="540" dy="25.7">metodológico de 2026.</tspan></text><rect x="980" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="980" y="340" width="400" height="34" fill="#E6E1DB"/><text x="992" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="992" dy="0.0">CONSULTA</tspan></text><rect x="1004" y="398" width="352" height="80" fill="#E6E1DB" rx="3"/><text x="1012" y="415" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">arrastrá una foto</tspan></text><rect x="1004" y="490" width="352" height="44" fill="#FFAFA3" rx="3"/><text x="1012" y="507" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">IA-6 · atributos detectados</tspan></text><rect x="1004" y="546" width="352" height="60" fill="#E6E1DB" rx="3"/><text x="1012" y="563" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1012" dy="0.0">en qué etapa está cada uno</tspan></text><text x="980" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="980" dy="0.0">Consulta por imagen</tspan></text><text x="980" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="980" dy="0.0">Responde a la devolución de la Entrega</tspan><tspan x="980" dy="25.7">1: ida y vuelta con imágenes.</tspan></text><rect x="1420" y="340" width="400" height="300" fill="#FFFFFF" rx="4" stroke="#C9C4BE" stroke-width="2"/><rect x="1420" y="340" width="400" height="34" fill="#E6E1DB"/><text x="1432" y="361" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="start"><tspan x="1432" dy="0.0">MÉTODO</tspan></text><rect x="1444" y="398" width="352" height="3" fill="#C9C4BE"/><rect x="1444" y="426" width="352" height="60" fill="#E6E1DB" rx="3"/><text x="1452" y="443" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1452" dy="0.0">tabla de fuentes y estado</tspan></text><rect x="1444" y="498" width="352" height="60" fill="#E6E1DB" rx="3"/><text x="1452" y="515" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1452" dy="0.0">límites declarados</tspan></text><rect x="1444" y="570" width="352" height="36" fill="#E6E1DB" rx="3"/><text x="1452" y="587" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1452" dy="0.0">cómo se calculó cada número</tspan></text><text x="1420" y="673" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1420" dy="0.0">Método</tspan></text><text x="1420" y="701" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1420" dy="0.0">Todo número lleva su fuente. Es la</tspan><tspan x="1420" dy="25.7">pantalla que hace citable a la app.</tspan></text><text x="100" y="821" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Falta Retornos, que repite la plantilla de Recorridos con el eje puesto en los ciclos cerrados. Nueve pantallas en total,</tspan><tspan x="100" dy="37.7">contando el detalle.</tspan></text></svg>