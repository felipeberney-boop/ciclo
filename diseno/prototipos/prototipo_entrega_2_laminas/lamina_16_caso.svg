<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F0EB"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">EL PROTOTIPO, PROBADO CON UNA PREGUNTA REAL</tspan></text><text x="100" y="229" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">«¿Me subo al jean baggy</tspan><tspan x="100" dy="94.6">o ya llegué tarde?»</tspan></text><rect x="100" y="420" width="320" height="6" fill="#000000"/><text x="100" y="465" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="100" dy="0.0">01</tspan></text><text x="100" y="512" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">Portada → Denim</tspan></text><text x="100" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">La usuaria declara qué</tspan><tspan x="100" dy="34.8">quiere descubrir.</tspan></text><rect x="446" y="420" width="320" height="6" fill="#000000"/><text x="446" y="465" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="446" dy="0.0">02</tspan></text><text x="446" y="512" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#000000" text-anchor="start"><tspan x="446" dy="0.0">Recorridos</tspan></text><text x="446" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="446" dy="0.0">Los amplios pasan a los</tspan><tspan x="446" dy="34.8">ajustados en 2021. En</tspan><tspan x="446" dy="34.8">2025 la búsqueda es 55 %</tspan><tspan x="446" dy="34.8">amplios, 23 % ajustados,</tspan><tspan x="446" dy="34.8">22 % medios.</tspan></text><rect x="792" y="420" width="320" height="6" fill="#000000"/><text x="792" y="465" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="792" dy="0.0">03</tspan></text><text x="792" y="512" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#000000" text-anchor="start"><tspan x="792" dy="0.0">El ciclo</tspan></text><text x="792" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="792" dy="0.0">El K-means pone «jeans</tspan><tspan x="792" dy="34.8">amplios» en PICO y</tspan><tspan x="792" dy="34.8">«ajustados» en SATURADA.</tspan><tspan x="792" dy="34.8">El modelo no vio ninguna</tspan><tspan x="792" dy="34.8">etiqueta.</tspan></text><rect x="1138" y="420" width="320" height="6" fill="#000000"/><text x="1138" y="465" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="1138" dy="0.0">04</tspan></text><text x="1138" y="512" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1138" dy="0.0">Validación</tspan></text><text x="1138" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1138" dy="0.0">En las reseñas de</tspan><tspan x="1138" dy="34.8">Amazon, entre 2019 y</tspan><tspan x="1138" dy="34.8">2022, los ajustados caen</tspan><tspan x="1138" dy="34.8">39 % y los amplios suben</tspan><tspan x="1138" dy="34.8">79 %.</tspan></text><rect x="1484" y="420" width="320" height="6" fill="#FFAFA3"/><text x="1484" y="465" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#B8503D" text-anchor="start" letter-spacing="8"><tspan x="1484" dy="0.0">05</tspan></text><text x="1484" y="512" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#B8503D" text-anchor="start"><tspan x="1484" dy="0.0">IA-5 · la</tspan><tspan x="1484" dy="36.8">respuesta</tspan></text><text x="1484" y="575" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1484" dy="0.0">Cliente premium, 6</tspan><tspan x="1484" dy="34.8">meses: ESPERAR. El pico</tspan><tspan x="1484" dy="34.8">ya pasó para ese plazo.</tspan><tspan x="1484" dy="34.8">La oportunidad está en</tspan><tspan x="1484" dy="34.8">el corte medio, el único</tspan><tspan x="1484" dy="34.8">que todavía no se movió.</tspan></text><text x="100" y="902" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="400" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">La app no dice «el baggy está de moda». Dice en qué etapa está, con qué dato lo sabe,</tspan><tspan x="100" dy="40.6">y qué significa eso para el plazo de producción de quien pregunta.</tspan></text></svg>