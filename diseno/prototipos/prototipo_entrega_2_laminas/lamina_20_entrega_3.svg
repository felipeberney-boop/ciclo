<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F0EB"/><text x="100" y="124" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="6"><tspan x="100" dy="0.0">LO QUE SIGUE</tspan></text><text x="100" y="234" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">PARA LA ENTREGA 3</tspan></text><rect x="100" y="380" width="380" height="3" fill="#000000"/><text x="100" y="421" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="100" dy="0.0">01</tspan></text><text x="100" y="478" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#000000" text-anchor="start"><tspan x="100" dy="0.0">Groq API en vivo</tspan></text><text x="100" y="581" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">Hoy IA-5 corre con un</tspan><tspan x="100" dy="37.7">prompt fijo. Falta</tspan><tspan x="100" dy="37.7">conectarla para que la</tspan><tspan x="100" dy="37.7">recomendación se calcule</tspan><tspan x="100" dy="37.7">en el momento, con el</tspan><tspan x="100" dy="37.7">cliente y el plazo que</tspan><tspan x="100" dy="37.7">elija la usuaria.</tspan></text><rect x="530" y="380" width="380" height="3" fill="#000000"/><text x="530" y="421" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="530" dy="0.0">02</tspan></text><text x="530" y="478" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#000000" text-anchor="start"><tspan x="530" dy="0.0">Pasarela y venta</tspan><tspan x="530" dy="46.0">por género</tspan></text><text x="530" y="581" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="530" dy="0.0">Volver a agregar el corpus</tspan><tspan x="530" dy="37.7">separando menswear de</tspan><tspan x="530" dy="37.7">womenswear, que es la</tspan><tspan x="530" dy="37.7">división con la que</tspan><tspan x="530" dy="37.7">trabaja la industria.</tspan></text><rect x="960" y="380" width="380" height="3" fill="#000000"/><text x="960" y="421" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="960" dy="0.0">03</tspan></text><text x="960" y="478" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#000000" text-anchor="start"><tspan x="960" dy="0.0">Calzado</tspan></text><text x="960" y="581" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="960" dy="0.0">Sumar los términos que hoy</tspan><tspan x="960" dy="37.7">faltan y que son</tspan><tspan x="960" dy="37.7">justamente donde las</tspan><tspan x="960" dy="37.7">señales externas son más</tspan><tspan x="960" dy="37.7">fuertes.</tspan></text><rect x="1390" y="380" width="380" height="3" fill="#000000"/><text x="1390" y="421" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5C5955" text-anchor="start" letter-spacing="8"><tspan x="1390" dy="0.0">04</tspan></text><text x="1390" y="478" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#000000" text-anchor="start"><tspan x="1390" dy="0.0">La página de</tspan><tspan x="1390" dy="46.0">racional</tspan></text><text x="1390" y="581" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="1390" dy="0.0">Ya existe como pantalla de</tspan><tspan x="1390" dy="37.7">Método. Falta llevarla al</tspan><tspan x="1390" dy="37.7">nivel que pide la</tspan><tspan x="1390" dy="37.7">consigna: hipótesis,</tspan><tspan x="1390" dy="37.7">procesamiento y rol de la</tspan><tspan x="1390" dy="37.7">IA, en una sola lectura.</tspan></text><rect x="100" y="830" width="1720" height="3" fill="#000000"/><text x="100" y="880" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#5C5955" text-anchor="start"><tspan x="100" dy="0.0">El prototipo funcional ya está online y se puede recorrer hoy. Lo que falta no</tspan><tspan x="100" dy="42.0">es construirlo: es conectarle la IA en tiempo real y declarar bien lo que no</tspan><tspan x="100" dy="42.0">sabe.</tspan></text></svg>